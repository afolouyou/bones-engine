name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Zig)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain and dependencies
        run: pacman -Syu --noconfirm git nodejs zig sdl3 freetype2 assimp curl openssl xorg-server-xvfb xorg-xauth mesa

      - uses: actions/checkout@v4

      - name: Build
        run: zig build

      - name: Run unit tests and editor smoke test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_VIDEODRIVER: x11
        run: |
          cd zig-out/bin
          timeout 25 xvfb-run -a -s "-screen 0 1280x720x24" ./bones_editor > editor.log 2>&1 || true
          sed -i 's/\x1b\[[0-9;]*m//g' editor.log
          tail -40 editor.log
          grep -q 'Unit Tests finished!' editor.log || { echo "Engine did not finish the unit tests"; exit 1; }
          grep -q 'Engine fully initiated' editor.log || { echo "Engine failed to init"; exit 1; }
          if grep -q 'Test:$' editor.log; then echo "Unit test failure"; exit 1; fi
          if grep -q 'Cannot link the shader' editor.log; then echo "Shader compilation failure"; exit 1; fi

  windows:
    name: Windows (Zig/MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build
        run: zig build
