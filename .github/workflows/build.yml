name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Zig)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain and dependencies
        run: pacman -Syu --noconfirm git nodejs zig sdl3 freetype2 assimp curl openssl mesa libglvnd vulkan-headers vulkan-icd-loader vulkan-swrast vulkan-validation-layers

      - uses: actions/checkout@v4

      - name: Build
        run: zig build

      - name: Check the C ABI version entry point
        run: |
          cd zig-out/bin
          ./bones_editor --version | tee version.txt
          grep -q 'Bones Engine 0.01' version.txt

      - name: Run unit tests and scene smoke test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_VIDEODRIVER: offscreen
          BONES_REQUIRE_VULKAN: "1"
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: |
          cd zig-out/bin
          rm -rf /tmp/bones_scene_smoke
          timeout 60 stdbuf -oL -eL ./bones_editor --scene-smoke > editor.log 2>&1 || true
          sed -i 's/\x1b\[[0-9;]*m//g' editor.log
          tail -40 editor.log
          grep -q 'Unit Tests finished!' editor.log || { echo "Engine did not finish the unit tests"; exit 1; }
          grep -q 'Engine fully initiated' editor.log || { echo "Engine failed to init"; exit 1; }
          grep -q 'Renderer Contract (Vulkan) Test Passed' editor.log || { echo "Vulkan renderer contract test did not run"; exit 1; }
          grep -q 'Renderer Contract Resources (Vulkan) Test Passed' editor.log || { echo "Vulkan resources test did not run"; exit 1; }
          grep -q 'Scene smoke test scene drawn' editor.log || { echo "Scene smoke test did not draw the scene"; exit 1; }
          grep -q 'Scene smoke test passed' editor.log || { echo "Scene smoke test did not pass"; exit 1; }
          grep -q 'Game loop ended' editor.log || { echo "Scene smoke test did not shut down cleanly"; exit 1; }
          if grep -q 'Test:$' editor.log; then echo "Unit test failure"; exit 1; fi
          if grep -q 'Cannot link the shader' editor.log; then echo "Shader compilation failure"; exit 1; fi

      - name: Build the runtime without the editor
        run: zig build -Deditor=false -Dgame-source=tests/runtime_game -Dvulkan=false

      - name: Check the runtime entry point
        run: |
          cd zig-out/bin
          ./bones_runtime --version | tee runtime-version.txt
          grep -q 'Bones Engine 0.01' runtime-version.txt

  windows:
    name: Windows (compile check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # Linking is still blocked by the MSVC-built curl/zlib archives, whose
      # /DEFAULTLIB directives Zig resolves as GNU-style lib*.a names.
      # Rebuilding those dependencies for Zig is tracked for a later release.
      - name: Compile the editor
        run: zig build check

      - name: Compile the runtime without the editor
        run: zig build check -Deditor=false -Dgame-source=tests/runtime_game
