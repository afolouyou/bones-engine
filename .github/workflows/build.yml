name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Zig)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain and dependencies
        run: pacman -Syu --noconfirm git nodejs zig sdl3 freetype2 assimp curl openssl

      - uses: actions/checkout@v4

      - name: Build
        run: zig build
